name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Lint & Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff flask loguru requests apscheduler adbutils pyminitouch uiautomator2 portalocker opencv-python-headless

      - name: Create configs.py from template
        run: cp src/configs.template.py src/configs.py

      - name: Run verification suite
        run: python scripts/verify.py
